<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VibeVocab{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232c5f8a'/><text x='16' y='23' text-anchor='middle' font-size='20' font-family='serif' fill='white'>V</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}">VibeVocab</a>
        {% if g.current_user %}
        <div class="user-menu" id="userMenu">
            <button class="user-menu-trigger" id="userMenuTrigger" type="button">
                {% if g.current_user.avatar_url %}<img src="{{ g.current_user.avatar_url }}" class="avatar">{% endif %}
                <span>{{ g.current_user.name }}</span>
                <span class="user-menu-caret">▾</span>
            </button>
            <div class="user-menu-dropdown">
                {% if g.current_user.is_admin %}
                <div class="user-menu-section">Admin</div>
                <a href="{{ url_for('admin_users') }}" class="user-menu-item">Users</a>
                <a href="{{ url_for('admin_backups') }}" class="user-menu-item">Backups</a>
                <div class="user-menu-divider"></div>
                {% endif %}
                {% if single_user_mode %}
                <button type="button" class="user-menu-item user-menu-item-btn" disabled>Sign out</button>
                {% else %}
                <form method="post" action="{{ url_for('logout') }}">
                    <button type="submit" class="user-menu-item user-menu-item-btn">Sign out</button>
                </form>
                {% endif %}
            </div>
        </div>
        <script>
            (function() {
                var menu = document.getElementById('userMenu');
                var trigger = document.getElementById('userMenuTrigger');
                trigger.addEventListener('click', function(e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function() {
                    menu.classList.remove('open');
                });
            })();
        </script>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
