name: ${COMPOSE_PROJECT_NAME:-vibevocab}

services:

  db:
    image: postgres:${PG_VERSION:-16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibevocab}
      POSTGRES_USER: ${POSTGRES_USER:-vibevocab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibevocab}
    volumes:
      - ../../src/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:z
      - ${DB_DIR:-../../volumes/db}:/var/lib/postgresql/data:z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibevocab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ${WEB_DIR:-./images/web}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vibevocab}
      DB_USER: ${POSTGRES_USER:-vibevocab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vibevocab}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      SINGLE_USER: ${SINGLE_USER:-}
      BOOTSTRAP_USER: ${BOOTSTRAP_USER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      SUGGESTION_COUNT: ${SUGGESTION_COUNT:-3}
      LLM_SUGGESTION_PROMPT: ${LLM_SUGGESTION_PROMPT:-/prompts/example-sentences.txt}
      LLM_TRANSLATION_PROMPT: ${LLM_TRANSLATION_PROMPT:-/prompts/translate-example.txt}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-eleven_multilingual_v2}
      CARD_FLIP_INTER_AUDIO_PAUSE_MS: ${CARD_FLIP_INTER_AUDIO_PAUSE_MS:-1500}
      ENVIRONMENT: ${ENVIRONMENT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
    volumes:
      - ${WEB_DIR:-./images/web}:/app:z
      - ../../volumes/prompts:/prompts:ro,z
      - ../../src/sql/patches:/patches:ro,z
    ports:
      - "${APP_PORT:-5001}:5000"
    depends_on:
      db:
        condition: service_healthy

  backup:
    build:
      context: ./images/backup
      args:
        PG_VERSION: ${PG_VERSION:-16}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-vibevocab}
      PGUSER: ${POSTGRES_USER:-vibevocab}
      PGDATABASE: ${POSTGRES_DB:-vibevocab}
      BACKUP_INACTIVITY_MINUTES: ${BACKUP_INACTIVITY_MINUTES:-15}
      BACKUP_POLL_SECONDS: ${BACKUP_POLL_SECONDS:-60}
      ENVIRONMENT: ${ENVIRONMENT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-}
    volumes:
      - ../../src/scripts/watcher.sh:/watcher.sh:ro,z
    depends_on:
      db:
        condition: service_healthy
    command: bash /watcher.sh
    restart: unless-stopped
