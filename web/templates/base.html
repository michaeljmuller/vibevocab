<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VibeVocab{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}">VibeVocab</a>
        {% if g.current_user %}
        <div class="header-user">
            {% if g.current_user.avatar_url %}<img src="{{ g.current_user.avatar_url }}" class="avatar">{% endif %}
            <span>{{ g.current_user.name }}</span>
            {% if not single_user_mode %}
            <form method="post" action="{{ url_for('logout') }}"><button class="btn-signout">Sign out</button></form>
            {% endif %}
        </div>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
